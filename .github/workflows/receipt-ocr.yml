name: Receipt OCR Worker

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (UTC)
  workflow_dispatch:

jobs:
  run-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      PROCESSED_FOLDER_ID: ${{ secrets.PROCESSED_FOLDER_ID }}
      NEEDS_REVIEW_FOLDER_ID: ${{ secrets.NEEDS_REVIEW_FOLDER_ID }}

      MAX_PER_RUN: "10"
      QUOTA_PER_WINDOW: "30"
      QUOTA_WINDOW_HOURS: "12"
      CONTROL_ROW: "2"

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write service account key
        run: |
          echo "${{ secrets.GCP_SA_JSON_B64 }}" | base64 --decode > service_account.json

      - name: Run worker
        run: |
          python receipt_worker_once.py
